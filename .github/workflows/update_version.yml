name: Bump Minor Version on Direct Push to Develop

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update minor version in package.yaml
        run: |
          CURRENT_VERSION=$(grep "^version:" package.yaml | awk '{print $2}')
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
          sed -i "s/^version: .*/version: $NEW_VERSION/" package.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.yaml
          git commit -m "chore: bump minor version" || true
          git push origin develop || true
