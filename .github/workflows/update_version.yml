name: Bump Version on Develop

on:
  workflow_run:
    workflows: ["release.yml"]
    types: [completed]
    branches: [main]
  push:
    branches: [develop]
    paths:
      - 'package.yaml'
      - '.github/workflows/**'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update major version in package.yaml
        if: github.event_name == 'workflow_run'
        run: |
          CURRENT_VERSION=$(grep "version:" package.yaml | head -1 | awk '{print $2}')
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          NEW_MAJOR=$((MAJOR + 1))
          NEW_VERSION="${NEW_MAJOR}.0.0"
          sed -i "s/version: $CURRENT_VERSION/version: $NEW_VERSION/" package.yaml

      - name: Update minor version in package.yaml
        if: github.event_name == 'push'
        run: |
          CURRENT_VERSION=$(grep "version:" package.yaml | head -1 | awk '{print $2}')
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
          sed -i "s/version: $CURRENT_VERSION/version: $NEW_VERSION/" package.yaml

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.yaml
          git commit -m "chore: bump version" || true
          git push origin develop || true
