name: glados
version: 2.12.0
dependencies:
  - base >= 4.7 && < 5
  - mtl
  - process
  - directory
  - text
  - megaparsec
  - parser-combinators
  - containers
  - filepath

library:
  source-dirs: src
  exposed-modules:
    - AST
    - Parser
    - Interpreter
    - Compiler
  ghc-options:
    - -fhpc

executables:
  glados:
    main: Main.hs
    source-dirs: src

tests:
  glados-test:
    main: Test.hs
    source-dirs: test
    other-modules:
      - FluxTests
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -fhpc
    dependencies:
      - glados
      - tasty
      - tasty-hunit
      - process
      - filepath
      - directory
      - random

  coverage-tests:
    main: Coverage.hs
    source-dirs: test/coverage
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - glados
      - tasty
      - tasty-hunit
      - process
      - filepath
      - directory
      - temporary
      - process
      - filepath
      - directory